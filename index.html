
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu site - Versão 3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, "Segoe UI", Roboto, sans-serif;
      background: #0b1f3a;
      padding: 1rem;
      transition: background 0.3s;
    }

    .cartao {
      background: #d1d5db;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
      text-align: center;
      color: #1d1d1f;
      transition: background 0.3s, color 0.3s;
    }

    .emoji {
      font-size: 4rem;
    }

    h1 {
      margin: .5rem 0;
      color: #1976d2;
    }

    .pesquisa {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 1.5rem 0;
    }

    .pesquisa input {
      flex: 1 1 150px;
      min-width: 0;
      padding: 12px;
      border: 2px solid #aaa;
      border-radius: 10px;
      font-size: 1rem;
      background: #fff;
      color: #1d1d1f;
    }

    .pesquisa button {
      padding: 12px 14px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .pesquisa button:hover {
      background: #125ca8;
    }

    .pesquisa .botao-noturno {
      background: #374151;
      white-space: nowrap;
    }

    .pesquisa .botao-noturno:hover {
      background: #1f2937;
    }

    .versao {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 12px;
      background: #e5e7eb;
      text-align: left;
      line-height: 1.8;
    }

    code {
      background: #d1d5db;
      padding: 2px 6px;
      border-radius: 6px;
      overflow-wrap: anywhere;
    }

    footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #b8bec7;
      color: #555b65;
      font-size: .85rem;
    }

    /* Modo noturno */
    body.modo-noturno {
      background: #080d18;
    }

    .modo-noturno .cartao {
      background: #252b36;
      color: #f3f4f6;
    }

    .modo-noturno h1 {
      color: #60a5fa;
    }

    .modo-noturno .pesquisa input {
      background: #161b25;
      color: #f3f4f6;
      border-color: #4b5563;
    }

    .modo-noturno .pesquisa input::placeholder {
      color: #a1a1aa;
    }

    .modo-noturno .versao {
      background: #343b48;
    }

    .modo-noturno code {
      background: #454d5c;
      color: #f9fafb;
    }

    .modo-noturno footer {
      color: #c0c6d0;
      border-top-color: #454d5c;
    }

    @media (max-width: 480px) {
      .cartao {
        padding: 1.5rem;
      }

      .pesquisa button {
        flex: 1 1 auto;
      }
    }
  </style>
</head>

<body>

  <main class="cartao">

    <div class="emoji">❤️</div>

    <h1>Versão 3 — corrigida</h1>

    <p>O erro foi corrigido e o robô publicou de novo.</p>

    <form
      class="pesquisa"
      action="https://www.google.com/search"
      method="get"
      target="_blank"
    >
      <input
        type="search"
        name="q"
        placeholder="Digite sua pesquisa..."
        aria-label="Digite sua pesquisa"
        required
      >

      <button type="submit">🔎 Pesquisar</button>

      <button
        type="button"
        class="botao-noturno"
        id="alternarTema"
        aria-pressed="false"
        aria-label="Ativar modo noturno"
        onclick="alternarModoNoturno()"
      >
        🌙 Modo noturno
      </button>
    </form>

    <div class="versao">
      🤖 <strong>Publicado pelo robô em:</strong> __DATA__<br>
      🔖 <strong>Commit:</strong> <code>__COMMIT__</code><br>
      👤 <strong>Enviado por:</strong> __AUTOR__
    </div>

    <footer>
      🎓 UNINOVE · Automação de Processos · DevOps<br>
      Prof. Marcelino Dias da Silva
    </footer>

  </main>

  <script>
    function alternarModoNoturno() {
      const ativo = document.body.classList.toggle("modo-noturno");
      const botao = document.getElementById("alternarTema");

      botao.setAttribute("aria-pressed", String(ativo));
      botao.setAttribute(
        "aria-label",
        ativo ? "Desativar modo noturno" : "Ativar modo noturno"
      );

      botao.textContent = ativo
        ? "☀️ Modo claro"
        : "🌙 Modo noturno";
    }
  </script>

</body>
</html>
